[pytest]
# asyncio_mode = auto so the async integration tests in
# tests/test_execution_chain.py run without each needing an explicit
# event-loop fixture.
asyncio_mode = auto
testpaths = tests
filterwarnings =
    # backend/models/events.py uses datetime.utcnow() as a Pydantic
    # default_factory. Deprecated in 3.12+, but changing it alters the
    # timestamps every event carries, so it is a separate change from the
    # safety work and is left visible rather than silenced project-wide.
    default::DeprecationWarning
